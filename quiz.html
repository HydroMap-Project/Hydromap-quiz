<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HydroMap Quiz</title>
<link rel="stylesheet" href="quiz.css">
</head>
<body>

<header>
    <h1>HydroMap</h1>

    <div class="temas">
        <button class="tema" data-tema="escuro">Escuro</button>
        <button class="tema" data-tema="azul">Azul</button>
        <button class="tema" data-tema="verde">Verde</button>
    </div>
</header>

<section class="slideshow">
    <img id="slide" src="https://images.unsplash.com/photo-1446776653964-20c1d3a81b06?w=1200" alt="">
</section>

<section class="formulario">
    <h2>Cadastro</h2>

    <form id="contatoForm">
        <input type="text" id="nome" placeholder="Nome">
        <input type="email" id="email" placeholder="Email">
        <button type="submit" id="enviarBtn">Enviar</button>
    </form>
</section>

<section class="quiz-container">

    <h2>Quiz HydroMap</h2>

    <div id="quiz">
        <h3 id="pergunta"></h3>

        <div id="respostas"></div>

        <div class="botoes-controle">
            <button type="button" id="voltar">Voltar</button>
            <button type="button" id="proximo">Próxima</button>
        </div>
    </div>

    <div id="resultado" class="hidden">
        <h2>Resultado Final</h2>
        <p id="pontuacao"></p>
        <button onclick="location.reload()" id="refazerBtn">Refazer Quiz</button>
    </div>

</section>

<script src="script.js"></script>

</body>
</html>
